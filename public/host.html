<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主持人 - 多人答题</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/effects.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; } h1 { font-size: 24px; margin-bottom: 20px; }
    .card { background: #1e293b; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    input, textarea, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 16px; margin-bottom: 16px; }
    textarea { min-height: 80px; resize: vertical; }
    .btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-right: 10px; margin-bottom: 10px; }
    .btn-primary { background: #6366f1; color: white; } .btn-success { background: #10b981; color: white; } .btn-warning { background: #f59e0b; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .question-item { background: #0f172a; border-radius: 10px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #6366f1; }
    .option-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; } .option-row input[type="text"] { flex: 1; margin-bottom: 0; } .option-row input[type="radio"] { width: auto; margin: 0; }
    #lobby, #game, #finished { display: none; } #setup { display: block; }
    .players { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; } .player-chip { background: #334155; padding: 8px 14px; border-radius: 20px; font-size: 14px; }
    .big-code { font-size: 48px; font-weight: 800; letter-spacing: 8px; color: #a5b4fc; text-align: center; margin: 16px 0; }
    #qrcode { text-align: center; margin: 16px 0; } #qrcode img { border-radius: 12px; max-width: 220px; }
    .question-display { font-size: 28px; text-align: center; margin: 30px 0; line-height: 1.4; } .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
    .opt { padding: 20px; border-radius: 12px; font-size: 18px; text-align: center; font-weight: 600; } .opt0 { background: #ef4444; } .opt1 { background: #3b82f6; } .opt2 { background: #eab308; color: #000; } .opt3 { background: #22c55e; }
    .option-stat { display: block; margin-top: 8px; font-size: 14px; font-weight: 500; opacity: .9; }
    .top-option-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .top-option-stat { padding: 10px 6px; border-radius: 12px; color: white; text-align: center; font-size: 14px; font-weight: 800; box-shadow: inset 0 -3px 0 rgba(0,0,0,.16); }
    .top-option-stat:nth-child(1) { background: #ef4444; } .top-option-stat:nth-child(2) { background: #3b82f6; } .top-option-stat:nth-child(3) { background: #eab308; color: #111; } .top-option-stat:nth-child(4) { background: #22c55e; }
    .answer-bubbles { min-height: 116px; max-height: 180px; overflow: hidden; display: flex; flex-wrap: wrap; align-content: end; align-items: end; justify-content: center; gap: 8px; padding: 12px 8px 4px; margin: 8px 0 14px; border-radius: 14px; background: rgba(15,23,42,.65); }
    .answer-bubbles:empty::after { content: '等待参与者作答…'; color: #64748b; font-size: 14px; }
    .answer-bubble { width: var(--bubble-size); height: var(--bubble-size); flex: 0 0 var(--bubble-size); display: inline-flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; padding: 7px; border: 2px solid rgba(255,255,255,.75); border-radius: 50%; background: linear-gradient(145deg, #38bdf8, #6366f1 55%, #a855f7); color: white; font-size: 12px; font-weight: 700; box-shadow: 0 6px 14px rgba(0,0,0,.25); animation: bubble-rise .65s cubic-bezier(.2,.85,.3,1) both; }
    .answer-bubble-avatar { font-size: 25px; line-height: 1; }
    .answer-bubble-name { max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .answer-bubble-score { font-size: 11px; font-weight: 900; }
    @keyframes bubble-rise { from { opacity: 0; transform: translateY(90px) scale(.45); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .ranking { margin-top: 20px; } .rank-item { display: flex; justify-content: space-between; padding: 12px 16px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; }
    .live-rank-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .live-rank-grid .rank-item { width: 112px; height: 126px; margin: 0; padding: 10px 6px; border-radius: 28px; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white; background: linear-gradient(145deg, #6366f1, #14b8a6); box-shadow: 0 8px 18px rgba(0,0,0,.22); }
    .live-rank-grid .rank-item { width: var(--rank-size); height: var(--rank-size); flex: 0 0 var(--rank-size); border-radius: 50%; transition: width .5s ease, height .5s ease, transform .5s ease; }
    .live-rank-grid .rank-avatar { font-size: 30px; line-height: 1; }
    .live-rank-grid .rank-name { max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; margin: 6px 0 3px; }
    .live-rank-grid .rank-score { font-size: 16px; font-weight: 900; }
    .top-option-stats.revealed .top-option-stat { animation: stats-reveal .65s ease-out both; }
    @keyframes stats-reveal { from { opacity: .25; transform: translateY(-10px) scale(.9); } to { opacity: 1; transform: none; } }
    .rank-item:nth-child(1) { border: 2px solid gold; } .rank-item:nth-child(2) { border: 2px solid silver; } .rank-item:nth-child(3) { border: 2px solid #cd7f32; }
    .podium { display: flex; align-items: end; justify-content: center; gap: 8px; height: 280px; margin: 24px auto; max-width: 620px; }
    .podium-place { width: 31%; display: flex; flex-direction: column; align-items: center; justify-content: end; }
    .podium-player { width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: center; font-weight: 800; }
    .podium-avatar { font-size: 48px; line-height: 1; margin-bottom: 6px; filter: drop-shadow(0 5px 4px rgba(0,0,0,.25)); }
    .podium-block { width: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 25px; font-weight: 900; border-radius: 12px 12px 0 0; }
    .podium-place.first { order: 2; } .podium-place.second { order: 1; } .podium-place.third { order: 3; }
    .first .podium-block { height: 170px; background: linear-gradient(#facc15, #ca8a04); color: #422006; }
    .second .podium-block { height: 120px; background: linear-gradient(#cbd5e1, #64748b); color: #0f172a; }
    .third .podium-block { height: 85px; background: linear-gradient(#d97706, #92400e); color: #fff7ed; }
    .card { animation: slideIn .45s ease-out both; } .btn { transition: transform .18s ease, filter .18s ease; } .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .sound-toggle { position: fixed; right: 20px; top: 18px; z-index: 5; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; border-radius: 999px; padding: 8px 12px; cursor: pointer; }
    .top-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    .back-home { color: #a5b4fc; text-decoration: none; border: 1px solid #475569; border-radius: 10px; padding: 8px 12px; }
    .game-state-title { text-align: center; font-size: 30px; font-weight: 900; color: #fff; margin: 4px 0 18px; text-shadow: 0 0 18px rgba(129,140,248,.7); }
    .game-meta { display: grid; grid-template-columns: 1fr 1.5fr 1fr; align-items: center; gap: 16px; color: #c7d2fe; font-weight: 800; margin-bottom: 18px; }
    .game-meta > span:last-child { text-align: right; color: #67e8f9; }
    .progress-track { height: 10px; border-radius: 999px; background: #252b5f; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,.35); }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #22d3ee, #6366f1); box-shadow: 0 0 16px rgba(34,211,238,.65); transition: width .45s ease; }
    .round-status-panel { min-height: 178px; display: flex; align-items: center; justify-content: center; margin: 4px 0 20px; }
    .countdown-panel { width: 176px; height: 176px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 12px solid #22d3ee; box-shadow: 0 0 0 8px rgba(124,58,237,.45), 0 0 38px rgba(34,211,238,.55); background: radial-gradient(circle, #18205f, #0b1038 70%); }
    #timerDisplay { border: 0; padding: 0; background: none; box-shadow: none; font-size: 48px; color: #fff !important; }
    .bar-chart { width: min(760px, 100%); height: 178px; display: none; align-items: end; justify-content: space-around; gap: 22px; padding: 14px 28px 0; border-bottom: 2px solid rgba(199,210,254,.75); position: relative; }
    .bar-chart::before { content: '选择人数'; position: absolute; top: 0; left: 0; color: #a5b4fc; font-size: 13px; }
    .bar-column { height: 100%; flex: 1; display: flex; flex-direction: column; justify-content: end; align-items: center; gap: 7px; }
    .bar-value { color: #fff; font-weight: 900; font-size: 18px; }
    .bar-fill { width: min(76px, 70%); min-height: 5px; border-radius: 12px 12px 0 0; transform-origin: bottom; animation: bar-grow .7s cubic-bezier(.2,.8,.3,1) both; }
    .bar-label { font-size: 18px; font-weight: 900; color: #e0e7ff; }
    .bar-a { background: linear-gradient(#fb7185, #e11d48); } .bar-b { background: linear-gradient(#38bdf8, #2563eb); } .bar-c { background: linear-gradient(#fde047, #eab308); } .bar-d { background: linear-gradient(#4ade80, #16a34a); }
    @keyframes bar-grow { from { transform: scaleY(0); opacity: .3; } to { transform: scaleY(1); opacity: 1; } }
    .ranking-title { text-align: center; width: fit-content; margin: 12px auto 16px; padding: 9px 26px; border-radius: 999px; color: #fff; font-weight: 900; background: linear-gradient(135deg, #7c3aed, #4f46e5); box-shadow: 0 0 20px rgba(124,58,237,.4); }
    .live-rank-grid .rank-item { width: 150px !important; height: 120px !important; flex: 0 0 150px !important; border-radius: 22px !important; }
    .import-box { background: #0f172a; border: 1px dashed #475569; border-radius: 10px; padding: 14px; margin-bottom: 18px; }
    .import-box small { display: block; color: #94a3b8; margin-top: 4px; line-height: 1.5; }
    .delete-btn { background: #7f1d1d; color: #fecaca; padding: 8px 12px; font-size: 14px; }
    body { position: relative; overflow-x: hidden; background: radial-gradient(circle at 8% 0%, rgba(124,58,237,.3), transparent 32%), radial-gradient(circle at 100% 100%, rgba(6,182,212,.2), transparent 30%), #080b2a; }
    body::before, body::after { content: ''; position: fixed; width: 420px; height: 420px; border-radius: 50%; filter: blur(80px); opacity: .16; pointer-events: none; }
    body::before { background: #7c3aed; top: -190px; left: -160px; }
    body::after { background: #06b6d4; right: -190px; bottom: -190px; }
    .container { max-width: 1180px; position: relative; z-index: 1; }
    h1 { color: #fff; font-size: 30px; letter-spacing: .02em; text-shadow: 0 0 18px rgba(129,140,248,.65); }
    .card { background: linear-gradient(145deg, rgba(25,29,88,.96), rgba(11,15,54,.96)); border: 1px solid rgba(129,140,248,.48); border-radius: 24px; box-shadow: 0 0 0 1px rgba(34,211,238,.08), 0 22px 65px rgba(0,0,0,.35), 0 0 38px rgba(99,102,241,.16); }
    label { color: #aeb9ef; }
    input, textarea, select { background: rgba(7,11,44,.86); border-color: rgba(99,102,241,.5); color: #f5f7ff; }
    .btn { border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 8px 18px rgba(0,0,0,.2); }
    .btn-primary { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
    .btn-success { background: linear-gradient(135deg, #06b6d4, #0ea5e9); }
    .btn-warning { background: linear-gradient(135deg, #f59e0b, #f97316); }
    .question-display { font-size: clamp(28px, 4vw, 44px); font-weight: 850; letter-spacing: .01em; text-shadow: 0 0 22px rgba(255,255,255,.15); }
    #timerDisplay { padding: 8px 16px; border: 1px solid rgba(34,211,238,.65); border-radius: 999px; color: #67e8f9 !important; background: rgba(6,182,212,.12); box-shadow: 0 0 18px rgba(6,182,212,.2); }
    .top-option-stat { border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 8px 18px rgba(0,0,0,.15); }
    .answer-bubbles { border: 1px solid rgba(99,102,241,.35); background: linear-gradient(180deg, rgba(15,23,75,.35), rgba(7,11,44,.86)); }
    .options-grid { gap: 16px; }
    .opt { min-height: 86px; display: flex; flex-direction: column; justify-content: center; border: 2px solid rgba(255,255,255,.16); box-shadow: inset 0 -4px 0 rgba(0,0,0,.15), 0 10px 20px rgba(0,0,0,.18); font-size: 20px; }
    .live-rank-grid .rank-item { border-radius: 22px; border: 1px solid rgba(255,255,255,.2); background: linear-gradient(145deg, #312e81, #155e75); }
    .live-rank-grid .rank-item:nth-child(1) { border: 2px solid #facc15; box-shadow: 0 0 22px rgba(250,204,21,.25); }
    .live-rank-grid .rank-item:nth-child(2) { border: 2px solid #cbd5e1; }
    .live-rank-grid .rank-item:nth-child(3) { border: 2px solid #d97706; }
    .back-home { background: rgba(15,23,75,.7); }
    .final-card { padding: clamp(22px, 4vw, 42px); }
    .final-kicker { text-align:center; color:#67e8f9; letter-spacing:.18em; font-size:13px; font-weight:900; text-transform:uppercase; }
    .final-title { text-align:center; margin:8px 0 6px; font-size:clamp(28px, 4vw, 42px); }
    .final-subtitle { text-align:center; color:#aeb9ef; margin-bottom:18px; }
    .final-meta { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:0 auto 20px; color:#dbeafe; }
    .final-meta span { padding:8px 14px; border:1px solid rgba(103,232,249,.3); border-radius:999px; background:rgba(15,23,75,.7); }
    .final-ranking-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:24px; margin-bottom:10px; color:#c7d2fe; font-weight:900; }
    .final-ranking-list { display:grid; gap:9px; }
    .final-rank-row { display:grid; grid-template-columns:54px 48px 1fr auto; align-items:center; gap:10px; padding:12px 16px; border-radius:16px; background:rgba(7,11,44,.76); border:1px solid rgba(129,140,248,.25); }
    .final-rank-row:nth-child(1) { border-color:#facc15; box-shadow:0 0 18px rgba(250,204,21,.15); }
    .final-rank-number { color:#67e8f9; font-weight:900; font-size:18px; }
    .final-rank-avatar { font-size:29px; text-align:center; }
    .final-rank-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:800; }
    .final-rank-score { color:#fbbf24; font-size:18px; font-weight:900; }
    .final-actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:26px; }
  </style>
</head>
<body>
  <button class="sound-toggle" id="soundToggle" type="button">🔊 音乐开启</button>
  <div class="container">
    <div class="top-actions"><h1>🎯 主持人控制台</h1><a class="back-home" href="/">← 返回首页</a></div>
    <div id="setup"><div class="card">
      <label>活动标题</label><input id="quizTitle" value="趣味知识竞赛" placeholder="例如：公司年会知识竞赛">
      <div class="import-box"><label>一键导入题目（CSV 格式）</label><input id="questionFile" type="file" accept=".csv,text/csv"><button class="btn btn-primary" type="button" onclick="importQuestions()">导入 CSV 题库</button><small>表头：题目,选项A,选项B,选项C,选项D,正确答案,答题时间。正确答案填写 A、B、C 或 D。</small></div>
      <label>题目列表（可添加多道）</label><div id="questionsList"></div>
      <button class="btn btn-primary" onclick="addQuestion()">+ 添加题目</button><button class="btn btn-success" onclick="createRoom()">创建房间并生成二维码</button>
    </div></div>
    <div id="lobby"><div class="card">
      <h2 style="text-align:center;margin-bottom:8px;">房间码</h2><div class="big-code" id="roomCodeDisplay">------</div><div id="qrcode"></div>
      <p style="text-align:center;color:#94a3b8;margin-bottom:16px;">让玩家用手机扫描上方二维码，或打开 <b>/play.html</b> 输入房间码加入</p>
      <div><strong>已加入玩家：</strong><div class="players" id="playerList"></div></div>
      <div style="margin-top:24px;text-align:center;"><button class="btn btn-success" id="startBtn" onclick="startGame()" disabled>开始第一题</button><button class="btn" type="button" onclick="backToSetup()">← 返回上一步</button></div>
    </div></div>
    <div id="game"><div class="card">
      <div class="game-state-title" id="gameStateTitle">答题进行中</div>
      <div class="game-meta"><span id="qProgress">第 1 / 5 题</span><div class="progress-track"><div class="progress-fill" id="questionProgressFill"></div></div><span id="onlineCount">0 人在线</span></div>
      <div class="round-status-panel"><div class="countdown-panel" id="countdownPanel"><span id="timerDisplay">15s</span></div><div class="bar-chart" id="answerBarChart"></div></div>
      <div class="question-display" id="questionText">题目内容</div>
      <div class="options-grid" id="optionsDisplay"></div>
      <div class="ranking-title" id="rankingTitle">答题速度实时排名</div><div class="ranking" id="liveRanking"></div>
      <div style="text-align:center;margin-top:20px;"><button class="btn btn-warning" id="revealBtn" onclick="revealAnswer()" disabled style="display:none;">揭晓答案</button><button class="btn btn-success" id="nextBtn" onclick="nextQuestion()" disabled>等待本题揭晓</button></div>
    </div></div>
    <div id="finished"><div class="card final-card"><div class="final-kicker">GAME COMPLETE</div><h2 class="final-title">🏆 最终排名</h2><p class="final-subtitle">本局答题完成，感谢所有参与者</p><div class="final-meta"><span id="finalSessionMeta">0 人参与</span><span>主持人视图</span></div><div class="podium" id="finalPodium"></div><div class="final-ranking-heading"><span>完整成绩单</span><span>总积分</span></div><div class="final-ranking-list" id="finalRanking"></div><div class="final-actions"><button class="btn btn-primary" onclick="location.reload()">再来一局</button><button class="btn" onclick="backToSetup()">返回首页</button></div></div></div>
  </div>
  <script>
    const socket = io(); let currentCode = null; let questions = []; let timerInterval = null; let autoNextTimer = null; let timeLeft = 20; let questionEndPlayed = false; let currentQuestionIsLast = false; let currentOptionStats = [0, 0, 0, 0]; let speedRanking = []; let roundRevealed = false;
    document.getElementById('soundToggle').onclick = () => { const muted = window.quizFx.toggleMute(); document.getElementById('soundToggle').textContent = muted ? '🔇 音乐静音' : '🔊 音乐开启'; };
    document.addEventListener('click', e => { if (e.target.matches('button')) window.quizFx.click(); });
    const questionBank = [
      { text: '中国的首都是哪里？', options: ['上海', '北京', '广州', '深圳'], correctIndex: 1, timeLimit: 15 },
      { text: '1 + 1 = ?', options: ['1', '2', '3', '4'], correctIndex: 1, timeLimit: 10 },
      { text: '太阳系中最大的行星是哪一颗？', options: ['地球', '火星', '木星', '金星'], correctIndex: 2, timeLimit: 15 },
      { text: '水的化学式是什么？', options: ['CO2', 'O2', 'H2O', 'NaCl'], correctIndex: 2, timeLimit: 15 },
      { text: '一年有多少个月？', options: ['10', '11', '12', '13'], correctIndex: 2, timeLimit: 10 },
      { text: '彩虹通常有几种颜色？', options: ['5', '6', '7', '8'], correctIndex: 2, timeLimit: 15 },
      { text: '世界上面积最大的国家是？', options: ['中国', '加拿大', '俄罗斯', '美国'], correctIndex: 2, timeLimit: 15 },
      { text: 'HTML 主要用于做什么？', options: ['网页结构', '数据库', '图片编辑', '操作系统'], correctIndex: 0, timeLimit: 15 },
      { text: '地球唯一的天然卫星是？', options: ['太阳', '月球', '火星', '金星'], correctIndex: 1, timeLimit: 10 },
      { text: '三角形内角和是多少度？', options: ['90', '180', '270', '360'], correctIndex: 1, timeLimit: 15 }
    ];
    function renderQuestions() { const list = document.getElementById('questionsList'); list.innerHTML = ''; questions.forEach((q, idx) => { const div = document.createElement('div'); div.className = 'question-item'; div.id = `q-${idx}`; div.innerHTML = `<label>题目 ${idx + 1}</label><textarea placeholder="请输入题目内容" oninput="questions[${idx}].text=this.value">${q.text}</textarea><label>选项（选中正确选项）</label>${[0,1,2,3].map(i => `<div class="option-row"><input type="radio" name="correct-${idx}" ${q.correctIndex===i?'checked':''} onchange="questions[${idx}].correctIndex=${i}"><input type="text" placeholder="选项 ${String.fromCharCode(65+i)}" value="${q.options[i]||''}" oninput="questions[${idx}].options[${i}]=this.value"></div>`).join('')}<label>答题时间（秒）</label><input type="number" value="${q.timeLimit || 20}" min="5" max="60" oninput="questions[${idx}].timeLimit=parseInt(this.value)||20"><button class="btn delete-btn" type="button" onclick="removeQuestion(${idx})">删除这道题</button>`; list.appendChild(div); }); }
    function addQuestion(data = null) { questions.push(data || { text: '', options: ['', '', '', ''], correctIndex: 0, timeLimit: 20 }); renderQuestions(); }
    function removeQuestion(index) { if (questions.length <= 1) return alert('至少保留一道题目'); questions.splice(index, 1); renderQuestions(); }
    async function importQuestions() { const file = document.getElementById('questionFile').files[0]; if (!file) return alert('请先选择 CSV 题库文件'); const form = new FormData(); form.append('file', file); try { const response = await fetch('/api/import-questions', { method: 'POST', body: form }); const data = await response.json(); if (!response.ok) throw new Error(data.error || '导入失败'); questions = data.questions; renderQuestions(); alert(`成功导入 ${questions.length} 道题`); } catch (error) { alert(`导入失败：${error.message}`); } }
    questions = [...questionBank].sort(() => Math.random() - 0.5).slice(0, 5); renderQuestions();
    async function createRoom() { window.quizFx.start(); const valid = questions.filter(q => q.text.trim() && q.options.every(o => o.trim())); if (!valid.length) return alert('请至少填写一道完整的题目'); const res = await fetch('/api/create-room', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ quizTitle: document.getElementById('quizTitle').value, questions: valid }) }); const data = await res.json(); if (data.error) return alert(data.error); currentCode = data.code; document.getElementById('roomCodeDisplay').textContent = data.code; if (data.qrDataUrl) document.getElementById('qrcode').innerHTML = `<img src="${data.qrDataUrl}" alt="二维码">`; document.getElementById('setup').style.display = 'none'; document.getElementById('lobby').style.display = 'block'; socket.emit('host-join', { code: data.code }); }
    function backToSetup() { currentCode = null; document.getElementById('lobby').style.display = 'none'; document.getElementById('game').style.display = 'none'; document.getElementById('finished').style.display = 'none'; document.getElementById('setup').style.display = 'block'; }
    socket.on('host-joined', data => console.log('主持人已加入房间', data)); socket.on('player-list', list => { document.getElementById('playerList').innerHTML = list.map(p => `<div class="player-chip">${p.avatar || '😀'} ${p.nickname}</div>`).join('') || '<span style="color:#64748b">还没有人加入...</span>'; document.getElementById('startBtn').disabled = !list.length; document.getElementById('onlineCount').textContent = `${list.length} 人在线`; });
    socket.on('game-phase', data => window.quizFx.setPhase(data.phase, data.startedAt));
    function startGame() { window.quizFx.start(); window.quizFx.questionStart(); socket.emit('start-game', { code: currentCode }); document.getElementById('lobby').style.display = 'none'; document.getElementById('game').style.display = 'block'; autoNextTimer = setTimeout(() => nextQuestion(false), 2500); } function nextQuestion(playSound = true) { if (timerInterval) clearInterval(timerInterval); if (autoNextTimer) clearTimeout(autoNextTimer); if (playSound) window.quizFx.questionStart(); socket.emit('next-question', { code: currentCode }); }
    function renderOptionStats(stats, animate = false) { currentOptionStats = stats || currentOptionStats; const chart = document.getElementById('answerBarChart'); const max = Math.max(1, ...currentOptionStats); chart.innerHTML = currentOptionStats.map((count, i) => `<div class="bar-column"><span class="bar-value">${count}</span><div class="bar-fill bar-${String.fromCharCode(97 + i)}" style="height:${Math.max(8, count / max * 100)}%"></div><span class="bar-label">${String.fromCharCode(65 + i)}</span></div>`).join(''); if (animate) chart.querySelectorAll('.bar-fill').forEach((bar, i) => { bar.style.animationDelay = `${i * 100}ms`; }); }
    function renderRankingCards(ranking) { const container = document.getElementById('liveRanking'); container.replaceChildren(); const grid = document.createElement('div'); grid.className = 'live-rank-grid'; ranking.forEach((p, i) => { const card = document.createElement('div'); card.className = 'rank-item'; const avatar = document.createElement('span'); avatar.className = 'rank-avatar'; avatar.textContent = p.avatar || '😀'; const name = document.createElement('span'); name.className = 'rank-name'; name.textContent = `#${i + 1} ${p.nickname || '玩家'}`; const score = document.createElement('span'); score.className = 'rank-score'; score.textContent = `${p.score || 0} 分`; card.append(avatar, name, score); grid.appendChild(card); }); container.appendChild(grid); }
    function renderSpeedRanking() { renderRankingCards(speedRanking); }
    function renderLiveRanking(ranking) { renderRankingCards(ranking); }
    function setRoundState(revealed) { roundRevealed = revealed; document.getElementById('gameStateTitle').textContent = revealed ? '本题结束' : '答题进行中'; document.getElementById('rankingTitle').textContent = revealed ? '目前答题积分排名' : '答题速度实时排名'; document.getElementById('countdownPanel').style.display = revealed ? 'none' : 'flex'; document.getElementById('answerBarChart').style.display = revealed ? 'flex' : 'none'; }
    socket.on('question-host', q => { questionEndPlayed = false; currentQuestionIsLast = q.index === q.total - 1; currentOptionStats = [0, 0, 0, 0]; speedRanking = []; setRoundState(false); document.getElementById('questionProgressFill').style.width = `${((q.index + 1) / q.total) * 100}%`; document.getElementById('qProgress').textContent = `第 ${q.index + 1} / ${q.total} 题`; document.getElementById('questionText').textContent = q.text; document.getElementById('optionsDisplay').innerHTML = q.options.map((opt, i) => `<div class="opt opt${i}">${String.fromCharCode(65+i)}. ${opt}</div>`).join(''); renderOptionStats(currentOptionStats); renderSpeedRanking(); document.getElementById('revealBtn').style.display = currentQuestionIsLast ? 'inline-block' : 'none'; document.getElementById('revealBtn').disabled = true; document.getElementById('nextBtn').disabled = true; document.getElementById('nextBtn').textContent = '等待本题揭晓'; const endAt = q.startedAt + 15000; const updateTimer = () => { timeLeft = Math.max(0, Math.ceil((endAt - Date.now()) / 1000)); document.getElementById('timerDisplay').textContent = timeLeft > 0 ? timeLeft + 's' : '等待揭晓'; if (timeLeft <= 0) { clearInterval(timerInterval); if (!questionEndPlayed) { questionEndPlayed = true; window.quizFx.questionEnd(); } } else if (timeLeft <= 3 && !questionEndPlayed) { questionEndPlayed = true; window.quizFx.questionEnd(); } }; if (timerInterval) clearInterval(timerInterval); updateTimer(); if (timeLeft > 0) timerInterval = setInterval(updateTimer, 100); });
    socket.on('answer-progress', data => { speedRanking.push(data); renderSpeedRanking(); renderOptionStats(data.optionStats); });
    function revealAnswer() { if (!currentQuestionIsLast) return; window.quizFx.finish(); socket.emit('publish-final-result', { code: currentCode }); }
    socket.on('reveal', data => { document.querySelectorAll('.opt').forEach((el, i) => { if (i === data.correctIndex) { el.style.outline = '4px solid #fff'; el.style.transform = 'scale(1.05)'; } else el.style.opacity = '0.5'; }); renderOptionStats(data.optionStats, true); setRoundState(true); renderLiveRanking(data.ranking); if (currentQuestionIsLast) { document.getElementById('revealBtn').style.display = 'inline-block'; document.getElementById('revealBtn').disabled = false; document.getElementById('revealBtn').textContent = '揭晓答案'; document.getElementById('nextBtn').style.display = 'none'; } else { document.getElementById('revealBtn').style.display = 'none'; document.getElementById('nextBtn').disabled = false; document.getElementById('nextBtn').textContent = '下一题'; } });
    socket.on('score-update', ranking => { if (roundRevealed) renderLiveRanking(ranking); }); socket.on('game-over', data => { window.quizFx.celebrate(); document.getElementById('game').style.display = 'none'; document.getElementById('finished').style.display = 'block'; document.getElementById('finalSessionMeta').textContent = `${data.ranking.length} 人参与`; renderPodium(data.ranking); renderFinalRanking(data.ranking); });
    function renderFinalRanking(ranking) { const container = document.getElementById('finalRanking'); container.replaceChildren(); if (!ranking.length) { container.textContent = '没有参与者'; return; } ranking.forEach(p => { const row = document.createElement('div'); row.className = 'final-rank-row'; const rank = document.createElement('span'); rank.className = 'final-rank-number'; rank.textContent = `#${p.rank}`; const avatar = document.createElement('span'); avatar.className = 'final-rank-avatar'; avatar.textContent = p.avatar || '😀'; const name = document.createElement('span'); name.className = 'final-rank-name'; name.textContent = p.nickname || '玩家'; const score = document.createElement('span'); score.className = 'final-rank-score'; score.textContent = `${p.score || 0} 分`; row.append(rank, avatar, name, score); container.appendChild(row); }); }
    function renderPodium(ranking) { const podium = document.getElementById('finalPodium'); const places = [{ rank: 2, cls: 'second', label: '🥈' }, { rank: 1, cls: 'first', label: '🥇' }, { rank: 3, cls: 'third', label: '🥉' }]; podium.innerHTML = places.map(place => { const player = ranking[place.rank - 1]; if (!player) return ''; return `<div class="podium-place ${place.cls}"><div class="podium-avatar">${player.avatar || '😀'}</div><div class="podium-player">${player.nickname}</div><div class="podium-block"><div>${place.label}</div><small>${player.score} 分</small></div></div>`; }).join(''); }
  </script>
</body>
