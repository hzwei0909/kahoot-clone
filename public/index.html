<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人实时答题系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      overflow: hidden;
      position: relative;
    }
    body::before, body::after { content: ''; position: fixed; width: 360px; height: 360px; border-radius: 50%; filter: blur(8px); opacity: .28; animation: float 9s ease-in-out infinite alternate; pointer-events: none; }
    body::before { background: #f472b6; top: -120px; left: -100px; }
    body::after { background: #22d3ee; right: -100px; bottom: -140px; animation-delay: -4s; }
    @keyframes float { to { transform: translate(35px, 25px) scale(1.12); } }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
      z-index: 1;
      animation: rise .7s ease-out both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
    h1 { font-size: 28px; margin-bottom: 8px; color: #333; }
    p { color: #666; margin-bottom: 32px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
    .btn-host { background: #667eea; color: white; }
    .btn-play { background: #10b981; color: white; }
    a { color: inherit; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; }
    a:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,.18); }
    .sound { margin-top: 22px; border: 1px solid #ddd; border-radius: 999px; background: #f8fafc; color: #475569; padding: 8px 14px; cursor: pointer; }
    .footer { margin-top: 24px; font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎯 多人实时答题</h1>
    <p>类似 Kahoot 的实时抢分游戏<br>支持扫码加入 · 速度加分 · 实时排行</p>
    
    <a href="/host.html"><button class="btn btn-host">我是主持人（出题开房）</button></a>
    <a href="/play.html"><button class="btn btn-play">我是玩家（加入游戏）</button></a>
    <button class="sound" id="soundBtn" type="button">🔊 音乐开启</button>
    
    <div class="footer">
      本地运行 · 局域网多人可用<br>
      部署到公网后即可真正在线多人玩
    </div>
  </div>
  <script src="/effects.js"></script>
  <script>document.getElementById('soundBtn').onclick = () => { const muted = window.quizFx.toggleMute(); document.getElementById('soundBtn').textContent = muted ? '🔇 音乐静音' : '🔊 音乐开启'; };</script>
</body>
</html>
