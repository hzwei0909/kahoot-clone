<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>玩家加入 - 多人答题</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/effects.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1e293b; border-radius: 20px; padding: 28px; width: 100%; max-width: 400px; text-align: center; }
    h1 { font-size: 22px; margin-bottom: 20px; }
    input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 18px; margin-bottom: 16px; text-align: center; letter-spacing: 2px; }
    .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; background: #6366f1; color: white; }
    .btn:active { transform: scale(0.98); } .btn:disabled { opacity: 0.5; }
    #joinScreen, #waitScreen, #questionScreen, #resultScreen, #gameOverScreen { display: none; } #joinScreen { display: block; }
    .nickname { font-size: 20px; color: #a5b4fc; margin-bottom: 8px; } .score { font-size: 32px; font-weight: 800; color: #fbbf24; margin: 12px 0; }
    .question-text { font-size: 22px; line-height: 1.4; margin: 20px 0; padding: 0 8px; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .option-btn { padding: 22px 12px; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; color: white; cursor: pointer; min-height: 80px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .option-btn:active { transform: scale(0.96); } .option-btn:disabled { opacity: 0.7; cursor: default; }
    .opt0 { background: #ef4444; } .opt1 { background: #3b82f6; } .opt2 { background: #eab308; color: #111; } .opt3 { background: #22c55e; } .correct { outline: 4px solid #fff; } .wrong { opacity: 0.4; }
    .answer-correct { background: #16a34a !important; color: white !important; opacity: 1 !important; }
    .answer-wrong { background: #dc2626 !important; color: white !important; opacity: 1 !important; }
    .timer { font-size: 28px; font-weight: bold; color: #fbbf24; margin-bottom: 8px; } .result-icon { font-size: 64px; margin: 16px 0; }
    .rank-list { text-align: left; margin-top: 16px; } .rank-item { display: flex; justify-content: space-between; padding: 12px; background: #0f172a; border-radius: 10px; margin-bottom: 8px; }
    .avatar-picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 4px 0 16px; }
    .avatar-choice { border: 2px solid transparent; background: #0f172a; border-radius: 12px; padding: 8px; font-size: 26px; cursor: pointer; }
    .avatar-choice.selected { border-color: #a5b4fc; background: #3730a3; transform: scale(1.08); }
    .podium { display: flex; align-items: end; justify-content: center; gap: 8px; height: 260px; margin-top: 24px; }
    .podium-place { width: 31%; display: flex; flex-direction: column; align-items: center; justify-content: end; }
    .podium-player { width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 800; }
    .podium-avatar { font-size: 42px; line-height: 1; margin-bottom: 6px; filter: drop-shadow(0 5px 4px rgba(0,0,0,.25)); }
    .podium-block { width: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 24px; font-weight: 900; border-radius: 12px 12px 0 0; }
    .podium-place.first { order: 2; } .podium-place.second { order: 1; } .podium-place.third { order: 3; }
    .first .podium-block { height: 150px; background: linear-gradient(#facc15, #ca8a04); color: #422006; }
    .second .podium-block { height: 105px; background: linear-gradient(#cbd5e1, #64748b); color: #0f172a; }
    .third .podium-block { height: 75px; background: linear-gradient(#d97706, #92400e); color: #fff7ed; }
    .card { animation: popIn .45s ease-out both; } .option-btn { transition: transform .16s ease, filter .16s ease; } .option-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    @keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(12px); } to { opacity: 1; transform: none; } }
    .sound-toggle { position: fixed; right: 16px; top: 16px; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; border-radius: 999px; padding: 8px 12px; cursor: pointer; }
    .waiting-reveal { display: none; color: #fbbf24; font-size: 18px; font-weight: 700; margin-top: 18px; }
    .answer-status { display: none; margin-top: 16px; font-size: 20px; font-weight: 800; }
    .answer-status.correct-status { display: block; color: #4ade80; }
    .answer-status.wrong-status { display: block; color: #f87171; }
    .answer-status.empty-status { display: block; color: #fbbf24; }
    .back-home { display:inline-flex; margin-bottom:0; color:#c7d2fe; text-decoration:none; border:1px solid rgba(129,140,248,.45); border-radius:999px; padding:8px 14px; background:rgba(15,23,75,.72); }
    .page-topbar { position:fixed; inset:16px 16px auto; z-index:5; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .page-topbar-left, .page-topbar-right { display:flex; gap:8px; align-items:center; }
    .page-topbar .sound-toggle, .page-topbar .language-toggle { position:static; }
    .language-toggle { border:1px solid #475569; background:#1e293b; color:#e2e8f0; border-radius:999px; padding:8px 12px; cursor:pointer; }
    .join-logo-crop { position:relative; overflow:hidden; width:min(380px, 92%); height:115px; margin:0 auto 8px; }
    .join-logo { position:absolute; width:100%; max-height:none; left:50%; top:50%; transform:translate(-50%, -50%); }
    .avatar-select-row { display:flex; align-items:center; gap:10px; margin:4px 0 16px; }
    .avatar-preview { width:54px; height:54px; display:grid; place-items:center; border-radius:16px; font-size:32px; background:rgba(7,11,44,.9); border:1px solid rgba(129,140,248,.55); }
    .avatar-select { flex:1; margin:0; text-align:left; letter-spacing:0; }
    .round-ranking { display:none; margin-top:20px; text-align:left; border-top:1px solid rgba(129,140,248,.25); padding-top:16px; }
    .round-ranking.visible { display:block; }
    .round-ranking-title { color:#67e8f9; font-weight:900; text-align:center; margin-bottom:10px; }
    .round-rank-row { display:grid; grid-template-columns:36px 32px 1fr auto; align-items:center; gap:8px; padding:9px 10px; border-radius:12px; background:rgba(7,11,44,.7); margin-bottom:7px; }
    .round-rank-avatar { font-size:23px; text-align:center; }
    .round-rank-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
    .round-rank-score { color:#fbbf24; font-weight:900; }
    .final-summary { padding:14px; border-radius:18px; background:linear-gradient(135deg,rgba(124,58,237,.26),rgba(6,182,212,.16)); border:1px solid rgba(103,232,249,.28); margin:16px 0; }
    .final-summary-label { color:#aeb9ef; font-size:13px; }
    .final-rank-list { display:grid; gap:8px; text-align:left; margin-top:18px; }
    .final-rank-row { display:grid; grid-template-columns:40px 34px 1fr auto; align-items:center; gap:8px; padding:11px 12px; border-radius:14px; background:rgba(7,11,44,.72); border:1px solid rgba(129,140,248,.22); }
    .final-rank-row.me { border-color:#67e8f9; box-shadow:0 0 16px rgba(103,232,249,.2); }
    .final-rank-row .rank-no { color:#67e8f9; font-weight:900; }
    .final-rank-row .rank-avatar { font-size:23px; }
    .final-rank-row .rank-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
    .final-rank-row .rank-score { color:#fbbf24; font-weight:900; }
    body { background: radial-gradient(circle at 8% 0%, rgba(124,58,237,.3), transparent 35%), radial-gradient(circle at 100% 100%, rgba(6,182,212,.2), transparent 32%), #080b2a; }
    body::before, body::after { content: ''; position: fixed; width: 320px; height: 320px; border-radius: 50%; filter: blur(75px); opacity: .16; pointer-events: none; }
    body::before { background: #7c3aed; top: -150px; left: -140px; }
    body::after { background: #06b6d4; right: -140px; bottom: -150px; }
    .card { position: relative; z-index: 1; background: linear-gradient(145deg, rgba(25,29,88,.96), rgba(11,15,54,.96)); border: 1px solid rgba(129,140,248,.5); border-radius: 26px; box-shadow: 0 0 0 1px rgba(34,211,238,.08), 0 22px 65px rgba(0,0,0,.4), 0 0 36px rgba(99,102,241,.18); }
    h1 { color: #fff; text-shadow: 0 0 16px rgba(129,140,248,.6); }
    input { background: rgba(7,11,44,.86); border-color: rgba(99,102,241,.55); }
    .btn { background: linear-gradient(135deg, #7c3aed, #4f46e5); border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 8px 18px rgba(0,0,0,.2); }
    .timer { padding: 8px 18px; border: 1px solid rgba(34,211,238,.65); border-radius: 999px; color: #67e8f9; background: rgba(6,182,212,.12); box-shadow: 0 0 18px rgba(6,182,212,.2); }
    .question-text { font-size: clamp(24px, 5vw, 34px); font-weight: 850; text-shadow: 0 0 18px rgba(255,255,255,.15); }
    .option-btn { border: 2px solid rgba(255,255,255,.18); box-shadow: inset 0 -4px 0 rgba(0,0,0,.15), 0 8px 18px rgba(0,0,0,.2); }
    .waiting-reveal { color: #67e8f9; }
    .answer-status.correct-status { color: #4ade80; text-shadow: 0 0 14px rgba(74,222,128,.4); }
    .answer-status.wrong-status { color: #fb7185; text-shadow: 0 0 14px rgba(251,113,133,.35); }
  </style>
</head>
<body>
  <div class="page-topbar"><div class="page-topbar-left"><a class="back-home" href="/" data-i18n="backHome">← 返回首页</a></div><div class="page-topbar-right"><button class="sound-toggle" id="soundToggle" type="button" data-i18n="musicOn">🔊 音乐开启</button><button class="language-toggle" data-language-toggle type="button" onclick="window.quizI18n.toggle()">🌐 EN</button></div></div>
  <div class="card" id="joinScreen"><div class="join-logo-crop"><img class="join-logo" src="/assets/橙色趣味LOGO.png" alt="Live Quiz Logo"></div><h1 data-i18n="join">🎮 加入游戏</h1><input id="codeInput" data-i18n-placeholder="roomCode" placeholder="输入6位房间码" maxlength="6" style="text-transform:uppercase"><input id="nicknameInput" data-i18n-placeholder="nickname" placeholder="你的昵称" maxlength="12"><div style="text-align:left;color:#94a3b8;margin-bottom:8px;" data-i18n="chooseAvatar">选择你的头像</div><div class="avatar-select-row"><div class="avatar-preview" id="avatarPreview">😀</div><select class="avatar-select" id="avatarPicker" aria-label="Avatar"></select></div><button class="btn" onclick="joinGame()" data-i18n="joinButton">加入</button></div>
  <div class="card" id="waitScreen"><div class="nickname" id="myNickname"></div><p data-i18n="joinedRoom" style="color:#94a3b8;margin:16px 0;">已成功加入房间</p><div style="font-size:36px;letter-spacing:6px;color:#a5b4fc;margin:12px 0;" id="showCode"></div><p data-i18n="waitingHost" style="color:#64748b;">等待主持人开始...</p></div>
  <div class="card" id="questionScreen"><div class="timer" id="timer">20s</div><div style="color:#94a3b8;font-size:14px;" id="qInfo">第 1 题</div><div class="question-text" id="qText"></div><div class="options" id="options"></div><div class="waiting-reveal" id="waitingReveal" data-i18n="resultWaiting">等待揭晓答案……</div><div class="answer-status" id="answerStatus"></div><div class="round-ranking" id="roundRanking"><div class="round-ranking-title" data-i18n="currentRanking">本题当前排名</div><div id="roundRankingList"></div></div></div>
  <div class="card" id="resultScreen"><div class="result-icon" id="resultIcon">✓</div><div id="resultText" style="font-size:22px;margin-bottom:8px;"></div><div class="score" id="gotPoints">+0</div><div data-i18n="currentTotal" style="color:#94a3b8;">当前总分</div><div class="score" id="totalScore">0</div></div>
  <div class="card" id="gameOverScreen"><h1 data-i18n="finalRanking">🏆 最终排名</h1><div class="final-summary"><div class="final-summary-label" data-i18n="myFinalScore">我的最终成绩</div><div class="score" id="finalMyScore">0 分</div><div id="finalMyRank" style="color:#67e8f9;font-weight:900;">—</div></div><div class="podium" id="finalPodium"></div><div class="final-rank-list" id="finalRank"></div></div>
  <script src="/i18n.js"></script><script>
    const socket = io(); let myPlayerId = null; let myScore = 0; let myNickname = ''; let timerInterval = null; let answered = false; let selectedAvatar = '😀'; let selectedAnswerIndex = null;
    const avatarOptions = [['😀','Smile'],['😎','Cool'],['🤩','Star'],['🥳','Party'],['🦊','Fox'],['🐼','Panda'],['🐸','Frog'],['🦄','Unicorn'],['🐯','Tiger'],['🐨','Koala'],['🚀','Rocket'],['🌟','Star'],['🧙‍♂️','Wizard'],['🧙‍♀️','Witch'],['👮','Police'],['👩‍⚕️','Doctor'],['👷','Worker'],['👸','Queen'],['🥷','Ninja'],['🧑‍🚀','Astronaut'],['🧑‍🍳','Chef'],['🧑‍🔬','Scientist'],['🦸‍♂️','Superhero'],['🦸‍♀️','Superhero'],['🧝‍♂️','Elf'],['🧝‍♀️','Elf'],['🧛‍♂️','Vampire'],['🧛‍♀️','Vampire'],['🧜‍♀️','Mermaid'],['🧚‍♀️','Fairy'],['👨‍🎓','Student'],['👩‍🎓','Student']];
    document.getElementById('avatarPicker').innerHTML = avatarOptions.map(([avatar, label]) => `<option value="${avatar}">${avatar} ${label}</option>`).join('');
    document.getElementById('avatarPicker').onchange = event => { selectedAvatar = event.target.value; document.getElementById('avatarPreview').textContent = selectedAvatar; window.quizFx.click(); };
    document.getElementById('soundToggle').onclick = () => { const muted = window.quizFx.toggleMute(); const zh = window.quizI18n.getLanguage() === 'zh'; document.getElementById('soundToggle').textContent = muted ? (zh ? '🔇 音乐静音' : '🔇 Music Muted') : (zh ? '🔊 音乐开启' : '🔊 Music On'); };
    const urlParams = new URLSearchParams(location.search); if (urlParams.get('code')) document.getElementById('codeInput').value = urlParams.get('code').toUpperCase();
    function joinGame() { const code = document.getElementById('codeInput').value.trim().toUpperCase(); const nickname = document.getElementById('nicknameInput').value.trim(); if (!code || code.length < 4) return alert(window.quizI18n.getLanguage() === 'zh' ? '请输入正确的房间码' : 'Please enter a valid room code'); window.quizFx.unlock(); socket.emit('player-join', { code, nickname, avatar: selectedAvatar }); }
    socket.on('joined', data => { myPlayerId = data.playerId; myNickname = data.nickname; window.quizFx.playerJoin(); document.getElementById('joinScreen').style.display = 'none'; document.getElementById('waitScreen').style.display = 'block'; document.getElementById('myNickname').textContent = data.nickname; document.getElementById('showCode').textContent = data.code; });
    socket.on('game-phase', data => window.quizFx.setPhase(data.phase, data.startedAt));
    socket.on('question', q => { answered = false; selectedAnswerIndex = null; document.getElementById('waitingReveal').style.display = 'none'; document.getElementById('answerStatus').className = 'answer-status'; document.getElementById('answerStatus').textContent = ''; document.getElementById('roundRanking').classList.remove('visible'); document.getElementById('roundRankingList').replaceChildren(); document.getElementById('waitScreen').style.display = 'none'; document.getElementById('resultScreen').style.display = 'none'; document.getElementById('questionScreen').style.display = 'block'; document.getElementById('qInfo').textContent = `第 ${q.index + 1} / ${q.total} 题`; document.getElementById('qText').textContent = q.text; document.getElementById('options').innerHTML = q.options.map((opt, i) => `<button class="option-btn opt${i}" onclick="submitAnswer(${i})" id="opt${i}">${opt}</button>`).join(''); const endAt = q.startedAt + 15000; const updateTimer = () => { const remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000)); document.getElementById('timer').textContent = remaining + 's'; if (remaining <= 0) { clearInterval(timerInterval); document.querySelectorAll('.option-btn').forEach(b => b.disabled = true); document.getElementById('waitingReveal').style.display = 'block'; } }; if (timerInterval) clearInterval(timerInterval); updateTimer(); if (Math.max(0, Math.ceil((endAt - Date.now()) / 1000)) > 0) timerInterval = setInterval(updateTimer, 100); });
    function submitAnswer(index) { if (answered) return; answered = true; selectedAnswerIndex = index; document.querySelectorAll('.option-btn').forEach(b => b.disabled = true); document.getElementById('opt' + index).style.outline = '3px solid white'; window.quizFx.answerClick(); if (navigator.vibrate) navigator.vibrate(45); socket.emit('submit-answer', { answerIndex: index }); }
    socket.on('answer-result', data => { myScore = data.yourScore; });
    function renderRoundRanking(ranking) { const list = document.getElementById('roundRankingList'); list.replaceChildren(); ranking.forEach((p, i) => { const row = document.createElement('div'); row.className = 'round-rank-row'; const no = document.createElement('strong'); no.textContent = `#${i + 1}`; const avatar = document.createElement('span'); avatar.className = 'round-rank-avatar'; avatar.textContent = p.avatar || '😀'; const name = document.createElement('span'); name.className = 'round-rank-name'; name.textContent = p.nickname || '玩家'; const score = document.createElement('span'); score.className = 'round-rank-score'; score.textContent = `${p.score || 0} 分`; row.append(no, avatar, name, score); list.appendChild(row); }); document.getElementById('roundRanking').classList.add('visible'); }
    socket.on('reveal', data => { document.getElementById('waitingReveal').style.display = 'none'; const status = document.getElementById('answerStatus'); const correctButton = document.getElementById('opt' + data.correctIndex); if (correctButton) correctButton.classList.add('correct', 'answer-correct'); if (selectedAnswerIndex === null) { status.textContent = window.quizI18n.t('noAnswer'); status.className = 'answer-status empty-status'; } else if (selectedAnswerIndex === data.correctIndex) { status.textContent = window.quizI18n.t('correct'); status.className = 'answer-status correct-status'; window.quizFx.correct(); } else { const selected = document.getElementById('opt' + selectedAnswerIndex); if (selected) selected.classList.add('wrong', 'answer-wrong'); status.textContent = window.quizI18n.t('wrong'); status.className = 'answer-status wrong-status'; window.quizFx.wrong(); } renderRoundRanking(data.ranking); });
    socket.on('game-over', data => { window.quizFx.celebrate(); document.getElementById('questionScreen').style.display = 'none'; document.getElementById('resultScreen').style.display = 'none'; document.getElementById('waitScreen').style.display = 'none'; document.getElementById('gameOverScreen').style.display = 'block'; const me = data.ranking.find(p => p.id === myPlayerId); document.getElementById('finalMyScore').textContent = `${me ? me.score : myScore} 分`; document.getElementById('finalMyRank').textContent = me ? `第 ${me.rank} 名 · 恭喜完成本局` : '本局已完成'; renderPodium(data.ranking); renderFinalRanking(data.ranking); });
    function renderFinalRanking(ranking) { const list = document.getElementById('finalRank'); list.replaceChildren(); ranking.forEach(p => { const row = document.createElement('div'); row.className = `final-rank-row${p.id === myPlayerId ? ' me' : ''}`; const rank = document.createElement('span'); rank.className = 'rank-no'; rank.textContent = `#${p.rank}`; const avatar = document.createElement('span'); avatar.className = 'rank-avatar'; avatar.textContent = p.avatar || '😀'; const name = document.createElement('span'); name.className = 'rank-name'; name.textContent = p.nickname || '玩家'; const score = document.createElement('span'); score.className = 'rank-score'; score.textContent = `${p.score || 0} 分`; row.append(rank, avatar, name, score); list.appendChild(row); }); }
    function renderPodium(ranking) { const podium = document.getElementById('finalPodium'); const places = [{ rank: 2, cls: 'second', label: '🥈' }, { rank: 1, cls: 'first', label: '🥇' }, { rank: 3, cls: 'third', label: '🥉' }]; podium.innerHTML = places.map(place => { const player = ranking[place.rank - 1]; if (!player) return ''; return `<div class="podium-place ${place.cls}"><div class="podium-avatar">${player.avatar || '😀'}</div><div class="podium-player">${player.nickname}</div><div class="podium-block"><div>${place.label}</div><small>${player.score} 分</small></div></div>`; }).join(''); }
    socket.on('error', e => alert(e.message));
  </script>
</body>
</html>
